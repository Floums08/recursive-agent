[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-workbench"
version = "0.2.0"
description = "Bounded evidence-driven improvement experiments for apps, docs, and workflows"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
recursive-workbench = "recursive_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["recursive_workbench*"]
