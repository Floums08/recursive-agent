name: Test public code and synthetic examples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and local HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic improvement smoke test
        run: python -m recursive_workbench demo --output demo-ci
      - name: Synthetic knowledge-planner smoke test
        run: python -m recursive_workbench daily --brain-root examples/brain-demo --vault demo-work --output "$RUNNER_TEMP/daily-plan" --date 2026-10-03
